<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#8a0b20"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/hub.css"><script src="/hub.js"></script><script src="/roster.js"></script><title>Group Maker · MD 2026</title>
<style>.gc{padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--sh-1)}.gc h3{margin:0 0 8px;font-size:14.5px;font-weight:800;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center;gap:8px}.gc h3 small{padding:2px 10px;border-radius:99px;background:var(--brand-soft);color:var(--brand-ink);font-size:11.5px;font-weight:800}.gc ol{margin:0;padding-left:22px}.gc li{padding:5px 0;font-weight:600}.gc li::marker{color:var(--ink-3);font-weight:700}.gc li i{margin-left:4px;vertical-align:1px}.gc li.ld{font-weight:800}.gc li.ld::after{content:' ★ Ketua';color:var(--brand-ink);font-size:11px}#out{display:grid;gap:10px;margin-top:14px}#bar{margin-top:14px}@media(min-width:640px){#out{grid-template-columns:repeat(2,1fr)}}@media(min-width:900px){#out{grid-template-columns:repeat(3,1fr)}}</style></head><body>
<div id="top" data-back="/academic" data-title="Group Maker" data-sub="Bagi kelompok dari data mahasiswa"></div>
<main class="wrap">
<div class="panel">
  <div class="seg" id="src"><button type="button" data-s="r" class="on">Data mahasiswa</button><button type="button" data-s="m">Input manual</button></div>
  <div id="rost"></div>
  <div id="man" hidden>
  <label class="lbl" for="names">Daftar nama <span id="cnt"></span></label>
  <textarea class="in" id="names" placeholder="Satu nama per baris. Tambahkan kelas dengan koma:&#10;Budi, A&#10;Sari, B&#10;Andi, C"></textarea></div>
  <div class="row">
    <div style="flex:2 1 170px"><label class="lbl" for="mode">Cara membagi</label><select class="in" id="mode" aria-label="Cara membagi"><option value="k">Jumlah kelompok</option><option value="n">Anggota per kelompok</option></select></div>
    <div style="flex:1 1 90px"><label class="lbl" for="num">Jumlah</label><input class="in" id="num" type="number" min="1" value="4"></div>
  </div>
  <div class="row" style="gap:0"><label class="chk" style="flex-basis:100%"><input type="checkbox" id="spread" checked> Sebar kelas merata di tiap kelompok</label><label class="chk" style="flex-basis:100%"><input type="checkbox" id="lead"> Pilih ketua secara acak</label></div>
  <p class="hint">Sisa anggota dibagi rata, selisih antar kelompok maksimal 1 orang. Pada input manual, kelas dibaca dari tulisan setelah koma.</p>
  <div class="row"><button class="btn" id="go">Acak kelompok</button></div>
</div>
<div id="bar" class="row" hidden><button class="btn ghost" id="cp">Salin teks</button><button class="btn ghost" id="csv">Unduh CSV</button></div>
<div id="out"></div></main>
<script>
var $=function(s){return document.querySelector(s)},G=[];
function rnd(n){var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296*n|0}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var SRC='r',R=Roster.mount($('#rost'),{});
document.querySelectorAll('#src button').forEach(function(b){b.onclick=function(){SRC=b.dataset.s;document.querySelectorAll('#src button').forEach(function(x){x.classList.toggle('on',x===b)});$('#rost').hidden=SRC!=='r';$('#man').hidden=SRC!=='m'}});
function parse(){if(SRC==='r')return R.selected();var seen={};return $('#names').value.split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean).map(function(l){var p=l.split(',');return{n:p.shift().trim(),c:p.join(',').trim()}}).filter(function(x){var k=x.n.toLowerCase();if(!x.n||seen[k])return false;return seen[k]=1})}
$('#names').oninput=function(){var n=parse().length;$('#cnt').textContent=n?'('+n+' orang)':''};
$('#go').onclick=function(){
  var P=parse();if(P.length<2){alert(SRC==='r'?'Centang minimal 2 mahasiswa.':'Masukkan minimal 2 nama.');return}
  var v=Math.max(1,+$('#num').value||1),k=$('#mode').value==='k'?v:Math.round(P.length/v);k=Math.min(Math.max(1,k),P.length);
  var o=shuf(P);
  if($('#spread').checked){var by={};o.forEach(function(p){(by[p.c||'-']=by[p.c||'-']||[]).push(p)});o=shuf(Object.keys(by)).reduce(function(a,c){return a.concat(by[c])},[])}
  G=Array.from({length:k},function(){return[]});o.forEach(function(p,i){G[i%k].push(p)});G=shuf(G);
  var L=$('#lead').checked;G=G.map(function(m){return{m:m,l:L?rnd(m.length):-1}});show()};
function show(){$('#bar').hidden=false;$('#out').innerHTML=G.map(function(g,i){return '<div class="gc"><h3>Kelompok '+(i+1)+'<small>'+g.m.length+' orang</small></h3><ol>'+g.m.map(function(p,j){return '<li'+(j===g.l?' class="ld"':'')+'>'+esc(p.n)+(p.c?' <i class="kt'+(/^[ABC]$/.test(p.c)?' k-'+p.c:'')+'">'+esc(p.c)+'</i>':'')+'</li>'}).join('')+'</ol></div>'}).join('')}
$('#cp').onclick=function(){var t=G.map(function(g,i){return 'Kelompok '+(i+1)+'\n'+g.m.map(function(p,j){return (j+1)+'. '+p.n+(p.c?' ('+p.c+')':'')+(j===g.l?' - Ketua':'')}).join('\n')}).join('\n\n');navigator.clipboard.writeText(t).then(function(){$('#cp').textContent='Tersalin ✓';setTimeout(function(){$('#cp').textContent='Salin teks'},1500)})};
$('#csv').onclick=function(){var r=['Kelompok,Nama,Kelas,Ketua'];G.forEach(function(g,i){g.m.forEach(function(p,j){r.push([i+1,'"'+p.n.replace(/"/g,'""')+'"','"'+p.c+'"',j===g.l?'Ya':''].join(','))})});var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.join('\n')],{type:'text/csv'}));a.download='kelompok.csv';a.click()};
</script></body></html>
