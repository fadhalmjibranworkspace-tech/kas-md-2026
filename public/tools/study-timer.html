<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#8a0b20"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/hub.css"><script src="/hub.js"></script><title>Study Timer · MD 2026</title>
<style>.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface-3)}.tabs button{flex:1;min-height:40px;padding:8px 4px;border:0;border-radius:11px;background:none;font-weight:800;font-size:12.5px;color:var(--ink-2)}.tabs button.on{background:var(--surface);color:var(--brand-ink);box-shadow:var(--sh-1)}.set>*{flex-basis:90px}.ctr .btn{flex:1 1 calc(50% - 10px);min-width:0}.ctr{flex-wrap:wrap}
.ring{position:relative;width:min(280px,76vw);margin:22px auto}.ring svg{display:block;width:100%;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:9}.ring .bg{stroke:var(--surface-3)}.ring .fg{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.ring b{font-size:clamp(46px,14vw,64px);font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}.ring small{margin-top:6px;color:var(--ink-3);font-weight:700}
.ctr{display:flex;justify-content:center;gap:10px}
body.zen .app-header,body.zen .tabs,body.zen .set,body.zen #zen{display:none}body.zen .wrap{display:grid;place-content:center;min-height:100dvh}body.zen .panel{border:0;box-shadow:none;background:none}body.zen .ring{width:min(420px,84vw)}body.zen #zx{display:inline-flex}#zx{display:none}</style></head><body>
<div id="top" data-back="/academic" data-title="Study Timer" data-sub="Fokus dan istirahat bergantian"></div>
<main class="wrap">
<div class="panel"><div class="tabs" id="tabs"><button data-m="0" class="on">Fokus</button><button data-m="1">Istirahat</button><button data-m="2">Panjang</button></div>
<div class="ring"><svg viewBox="0 0 200 200"><circle class="bg" cx="100" cy="100" r="90"/><circle class="fg" id="fg" cx="100" cy="100" r="90" stroke-dasharray="565.49" stroke-dashoffset="0"/></svg><div><b id="t">25:00</b><small id="st">Sesi ke-1</small></div></div>
<div class="ctr"><button class="btn" id="go">Mulai</button><button class="btn ghost" id="rs">Ulang</button><button class="btn ghost" id="zen">Mode fokus</button><button class="btn ghost" id="zx">Keluar mode fokus</button></div>
<div class="row set"><div><label class="lbl">Fokus (menit)</label><input class="in" type="number" min="1" max="180" value="25" data-d="0"></div><div><label class="lbl">Istirahat</label><input class="in" type="number" min="1" max="60" value="5" data-d="1"></div><div><label class="lbl">Panjang</label><input class="in" type="number" min="1" max="90" value="15" data-d="2"></div></div>
<p class="hint set">Setelah 4 sesi fokus, istirahat panjang disarankan. Bunyi bip menandai waktu habis.</p></div></main>
<script>
var $=function(s){return document.querySelector(s)},D=[25,5,15],M=0,left=D[0]*60000,end=0,iv=0,n=1,wl=null,C=565.49;
var NM=['Fokus','Istirahat','Istirahat panjang'];
function fmt(ms){var s=Math.ceil(ms/1000);return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function draw(){$('#t').textContent=fmt(left);$('#fg').style.strokeDashoffset=C*(1-left/(D[M]*60000));document.title=(iv?fmt(left)+' · ':'')+NM[M]+' · Study Timer'}
function mode(m,keep){M=m;left=D[m]*60000;stop();document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',+b.dataset.m===m)});$('#st').textContent=m?NM[m]:'Sesi ke-'+n;$('#go').textContent='Mulai';draw()}
function stop(){clearInterval(iv);iv=0;$('#go').textContent=left<D[M]*60000?'Lanjut':'Mulai';if(wl){wl.release();wl=null}}
function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)();[0,.3,.6].forEach(function(t){var o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.25,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.22);o.start(c.currentTime+t);o.stop(c.currentTime+t+.25)})}catch(e){}if(navigator.vibrate)navigator.vibrate([200,100,200])}
$('#go').onclick=function(){if(iv){stop();return}end=Date.now()+left;$('#go').textContent='Jeda';
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(function(l){wl=l},function(){})}catch(e){}
  iv=setInterval(function(){left=Math.max(0,end-Date.now());draw();if(!left){clearInterval(iv);iv=0;beep();if(M===0){n++;mode(n%4===1&&n>1?2:1)}else mode(0)}},250)};
$('#rs').onclick=function(){mode(M)};
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){mode(+b.dataset.m)}});
document.querySelectorAll('[data-d]').forEach(function(i){i.oninput=function(){var v=Math.max(1,+i.value||1);D[+i.dataset.d]=v;if(!iv&&+i.dataset.d===M)mode(M)}});
$('#zen').onclick=function(){document.body.classList.add('zen');try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}};
$('#zx').onclick=function(){document.body.classList.remove('zen');try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}};
draw();
</script></body></html>
