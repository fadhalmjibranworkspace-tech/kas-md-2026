<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#8a0b20"><link rel="icon" type="image/png" sizes="32x32" href="/brand/portal-32.png"><link rel="icon" type="image/png" sizes="48x48" href="/brand/portal-48.png"><link rel="apple-touch-icon" href="/brand/portal-180.png"><link rel="manifest" href="/manifest-portal.webmanifest"><meta name="application-name" content="Portal MD 2026"><meta name="apple-mobile-web-app-title" content="Portal MD"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/hub.css"><script src="/hub.js"></script><script src="/roster.js"></script><title>Random Name Picker · MD 2026</title>
<style>#box{position:relative;overflow:hidden;display:grid;place-items:center;min-height:160px;padding:22px;border-radius:28px;background:var(--hero);color:#fff;font-size:clamp(26px,8vw,40px);font-weight:800;letter-spacing:-.03em;text-align:center;word-break:break-word;box-shadow:0 18px 40px rgba(140,10,35,.32)}#box::before{content:'';position:absolute;right:-60px;top:-80px;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 68%);pointer-events:none}#box::after{content:'';position:absolute;left:20px;bottom:18px;width:60px;height:60px;border-radius:50%;border:1px solid rgba(255,255,255,.26);box-shadow:0 0 0 12px rgba(255,255,255,.05);pointer-events:none}#box.pop{animation:pp .5s cubic-bezier(.34,1.56,.64,1)}@keyframes pp{from{transform:scale(.92)}to{transform:none}}#his{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}#his span{padding:5px 12px;border-radius:99px;background:var(--brand-soft);color:var(--brand-ink);font-weight:800;font-size:12.5px}#his:empty{display:none}</style></head><body>
<div id="top" data-back="/academic" data-title="Random Name Picker" data-sub="Acak satu nama dari yang ikut"></div>
<main class="wrap">
<div class="panel"><div id="box">Siap memilih?</div>
<div class="row"><button class="btn" id="go">Pilih acak</button><button class="btn ghost" id="rs">Reset riwayat</button></div>
<label class="chk" style="margin-top:14px"><input type="checkbox" id="rm" checked> Nama yang sudah terpilih tidak dipilih lagi</label>
<div id="his"></div></div>
<div class="panel"><div class="seg" id="src"><button type="button" data-s="r" class="on">Data mahasiswa</button><button type="button" data-s="m">Input manual</button></div>
<div id="rost"></div>
<div id="man" hidden><label class="lbl" for="names">Daftar nama <span id="cnt"></span></label><textarea class="in" id="names" placeholder="Satu nama per baris"></textarea></div></div></main>
<script>
var $=function(s){return document.querySelector(s)},done=[],busy=0;
function rnd(n){var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296*n|0}
var SRC='r',R=Roster.mount($('#rost'),{});
document.querySelectorAll('#src button').forEach(function(b){b.onclick=function(){SRC=b.dataset.s;document.querySelectorAll('#src button').forEach(function(x){x.classList.toggle('on',x===b)});$('#rost').hidden=SRC!=='r';$('#man').hidden=SRC!=='m'}});
function list(){if(SRC==='r')return R.selected().map(function(p){return p.n});var s={};return $('#names').value.split(/\r?\n/).map(function(x){return x.trim()}).filter(function(x){return x&&!s[x.toLowerCase()]&&(s[x.toLowerCase()]=1)})}
$('#names').oninput=function(){var n=list().length;$('#cnt').textContent=n?'('+n+')':''};
$('#rs').onclick=function(){done=[];$('#his').innerHTML='';$('#box').textContent='Siap memilih?'};
$('#go').onclick=function(){
  if(busy)return;var all=list(),pool=all.filter(function(n){return!$('#rm').checked||done.indexOf(n)<0});
  if(!all.length){alert(SRC==='r'?'Centang minimal 1 mahasiswa dulu.':'Isi daftar nama dulu.');return}
  if(!pool.length){$('#box').textContent='Semua nama sudah terpilih';return}
  busy=1;var win=pool[rnd(pool.length)],d=40,t=0,b=$('#box');b.classList.remove('pop');
  (function step(){b.textContent=pool[rnd(pool.length)];t+=d;if(t<1500){d*=1.13;setTimeout(step,d)}else{b.textContent=win;b.classList.add('pop');done.push(win);$('#his').innerHTML=done.map(function(n){return '<span>'+n.replace(/</g,'&lt;')+'</span>'}).join('');busy=0}})()};
</script></body></html>
